<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя карта мест</title>
    
    <!-- Подключаем стили Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; } /* Карта на весь экран */
        .popup-media { max-width: 200px; display: block; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- Контейнер для карты -->
    <div id="map"></div>

    <!-- Подключаем скрипт Leaflet -->
    <script href="https://unpkg.com"></script>
    <script>
        // Инициализируем карту и ставим фокус (например, координаты Москвы [55.75, 37.61] и зум 10)
        const map = L.map('map').setView([55.7558, 37.6173], 10);

        // Добавляем бесплатные карты OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Функция для быстрого добавления точек с медиа
        function addPlace(lat, lng, title, description, imageUrl) {
            const popupContent = `
                <h3>${title}</h3>
                <p>${description}</p>
                <img class="popup-media" src="${imageUrl}" alt="${title}">
            `;
            
            L.marker([lat, lng])
                .addTo(map)
                .bindPopup(popupContent);
        }

        // Примеры точек (Координаты, Название, Описание, Ссылка на картинку)
        addPlace(55.7522, 37.6156, "Кремль", "Исторический центр Москвы.", "https://picsum.photos");
        addPlace(55.7601, 37.6184, "Большой театр", "Один из крупнейших в России театров.", "https://picsum.photos");
    </script>
</body>
</html>
